services:
  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    # host network: Caddy binds :80 directly on the host.
    # (bridge mode + -p 80:80 silently drops the port binding after
    #  docker stop/start on this Lighthouse box -> 502 from outside)
    network_mode: host
    command: caddy file-server --root /srv/blog --listen :80
    volumes:
      - /srv/blog:/srv/blog:ro
    restart: unless-stopped

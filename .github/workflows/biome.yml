name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        # 不要写 version: latest。CI 曾经用 latest 拉到 2.6.x，而本地
        # package.json 里是 2.2.5，两边规则/格式化输出不一致，导致 main
        # 一直红。省略 version 时 action 会从 package-lock.json 读取
        # @biomejs/biome 的确切版本，CI 与本地永远同一个二进制。
      - name: Run Biome
        run: biome ci ./src --reporter=github

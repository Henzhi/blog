name: Build and Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Astro Check
        run: npx astro check

      # 用与部署完全一致的命令（astro build && pagefind --site dist），
      # 否则这里过的构建和线上产物不是一回事，会漏掉 pagefind 索引相关的问题
      - name: Build site
        run: npm run build
